<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="./icon-192.jpg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<script src="themes.js"></script>
<script type="module" src="./firebase-config.js"></script>
<script type="module" src="./firebase-bridge.js"></script>
<style>
:root{--bg:#F5F3FF;--bg-soft:#EDE9FE;--card:#FFFFFF;--card-border:#DDD6FE;--text:#4C1D95;--text-soft:#A78BFA;--primary:#7C3AED;--hero:#7C3AED;--accent:#8B5CF6;--nav-bg:rgba(245,243,255,0.92)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:var(--bg);height:100dvh;overflow:hidden;transition:.3s}
.pageWrap{position:absolute;inset:0 0 88px 0;background:var(--bg)}
.page{position:absolute;inset:0;width:100%;height:100%;border:none;opacity:0;pointer-events:none;transition:opacity.25s;background:var(--bg)}
.page.active{opacity:1;pointer-events:auto;z-index:2}
.nav{position:fixed;bottom:14px;left:14px;right:14px;height:70px;background:var(--nav-bg);backdrop-filter:blur(24px) saturate(200%);-webkit-backdrop-filter:blur(24px) saturate(200%);border:1.5px solid var(--card-border);border-radius:22px;display:flex;align-items:center;padding:7px;gap:6px;z-index:100;box-shadow:0 20px 40px -12px rgba(0,0,0,.15)}
.nav button{flex:1;height:100%;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:15px;color:var(--text-soft);font-size:9.5px;font-weight:700;cursor:pointer}
.nav button.active{background:var(--hero);color:#fff;box-shadow:0 8px 20px color-mix(in srgb, var(--hero) 30%, transparent)}
</style>
</head>
<body>
<div class="pageWrap">
  <iframe data-page="home.html" src="home.html" class="page active" title="home"></iframe>
  <iframe data-page="daily.html" src="about:blank" class="page" title="daily"></iframe>
  <iframe data-page="attendance.html" src="about:blank" class="page" title="attendance"></iframe>
  <iframe data-page="tasks.html" src="about:blank" class="page" title="tasks"></iframe>
</div>
<nav class="nav">
  <button class="active" onclick="switchPage('home.html',this)"><span>🏠</span><span>الرئيسية</span></button>
  <button onclick="switchPage('daily.html',this)"><span>📊</span><span>اليومية</span></button>
  <button onclick="switchPage('attendance.html',this)"><span>⏱️</span><span>الحضور</span></button>
  <button onclick="switchPage('tasks.html',this)"><span>✓</span><span>المهام</span></button>
</nav>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
const frames=document.querySelectorAll('.page');
function switchPage(name,btn){
  frames.forEach(f=>{
    const is=f.dataset.page===name;
    f.classList.toggle('active',is);
    if(is && f.src.includes('about:blank')){ f.src=name; }
  });
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
