<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<script src="themes.js"></script>
<script type="module" src="./firebase-config.js"></script>
<script type="module" src="./firebase-bridge.js"></script>
<title>مساحة العمل</title>
<style>
:root{--hero:#D97706;--bg:#FDF6E3;--bg-soft:#FFF7ED;--card:#FFFFFF;--card-border:#F5E6C8;--text:#1C1917;--text-soft:#A16207;--primary:#D97706}
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:var(--bg);height:100dvh;overflow:hidden;display:flex;flex-direction:column;transition:.3s}
#app{flex:1;display:flex;flex-direction:column;background:var(--card);overflow:hidden;max-width:600px;margin:0 auto;width:100%;border-left:1px solid var(--card-border);border-right:1px solid var(--card-border)}
.nu-scroll::-webkit-scrollbar{width:0}
.color-dot{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--card);box-shadow:0 0 0 1px var(--card-border);cursor:pointer;flex-shrink:0}
.color-dot.active{box-shadow:0 0 0 2px var(--text)}
.excel-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.excel-cell{width:100%;aspect-ratio:1;border-radius:4px;border:1px solid var(--card-border);cursor:pointer}
.tab{flex:1;padding:7px 2px;border:none;border-radius:8px;background:transparent;font-size:9.8px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--text-soft)}
.tab.active{background:var(--hero);color:#fff;font-weight:800;box-shadow:0 2px 8px color-mix(in srgb, var(--hero) 35%, transparent)}
#cameraVideo{width:100%;border-radius:10px;background:#000;aspect-ratio:3/4;object-fit:cover}
.hidden-note{background:var(--hero);color:#fff;border-radius:10px;padding:9px;margin-bottom:7px;border:1px solid var(--card-border);line-height:1.6;font-size:11.5px}
.filter-chip{padding:6px 9px;border-radius:99px;border:1px solid var(--card-border);background:var(--card);font-size:9.8px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--text-soft)}
.filter-chip.active{background:var(--hero);color:#fff;border-color:var(--hero)}
#deleteWarningModal,#secretCodeModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:11000;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(8px)}
#deleteWarningModal.show,#secretCodeModal.show{display:flex}
.rich-toolbar{display:flex;gap:5px;padding:7px;background:var(--bg-soft);border-radius:9px;margin-bottom:7px;overflow:auto;align-items:center;flex-shrink:0;direction:rtl}
.rich-toolbar button{border:1px solid var(--card-border);background:var(--card);padding:6px 10px;border-radius:7px;font-weight:800;flex-shrink:0;cursor:pointer;color:var(--text);font-size:11.5px;min-width:32px}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--card);box-shadow:0 0 0 1px #ccc;cursor:pointer;flex-shrink:0}
.rich-editor{flex:1;min-height:30vh;border:1px solid var(--card-border);border-radius:9px;padding:11px;outline:none;background:var(--card);line-height:1.8;overflow:auto;direction:rtl;text-align:right;white-space:pre-wrap;word-break:break-word;color:var(--text);font-size:12.6px}
.rich-editor ul,.rich-editor ol{list-style-position:inside;padding:0;padding-right:20px;margin:9px 0;direction:rtl;text-align:right}
#board{flex:1;overflow:auto;padding:7px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
</style>
</head>
<body>
<div id="app">
<div style="padding:9px 11px;border-bottom:1px solid var(--card-border);display:flex;justify-content:space-between;align-items:center;background:var(--card);position:sticky;top:0;z-index:5">
<div style="display:flex;gap:9px;align-items:center;"><div id="vaultTrigger" style="width:36px;height:36px;background:var(--hero);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;font-size:16px">✦</div><div><div style="font-weight:800;font-size:12.6px;color:var(--text)">مساحة العمل</div><div id="stats" style="font-size:9.2px;color:var(--text-soft);"></div></div></div>
<div style="display:flex;gap:5px;"><button onclick="openManager()" style="background:var(--bg-soft);border:1px solid var(--card-border);padding:7px 9px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--text);font-size:9.2px">⚙ إدارة</button><button onclick="addQuick()" style="background:var(--hero);color:#fff;border:none;padding:7px 11px;border-radius:8px;font-weight:800;cursor:pointer;font-size:9.2px">+ جديد</button></div>
</div>
<div style="padding:7px;background:var(--bg-soft);border-bottom:1px solid var(--card-border);">
<input id="mainInput" placeholder="ابحث أو أضف مهمة..." style="width:100%;background:var(--card);border:1px solid var(--card-border);padding:8px 9px;border-radius:9px;outline:none;font-weight:700;color:var(--text);font-size:11.5px">
<div style="display:flex;gap:5px;margin-top:7px;align-items:center;"><select id="cat" style="flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:7px;font-weight:700;color:var(--text);font-size:10.3px"></select><div id="quickColors" style="display:flex;gap:5px;flex:1;overflow:auto" class="nu-scroll"></div><button onclick="doAdd()" style="background:var(--hero);color:#fff;border:none;border-radius:8px;padding:7px 11px;font-weight:900;cursor:pointer;font-size:10.3px">إضافة</button></div>
</div>
<div style="background:var(--card);border-bottom:1px solid var(--card-border);padding:7px 9px;"><div id="taskTabsFilter" style="display:flex;gap:5px;overflow:auto" class="nu-scroll">
<button onclick="filterTasksTab('all')" id="tt_all" class="filter-chip active">الكل</button>
<button onclick="filterTasksTab('صيدلية')" id="tt_صيدلية" class="filter-chip">💊 صيدلية</button>
<button onclick="filterTasksTab('شغل')" id="tt_شغل" class="filter-chip">💻 شغل</button>
<button onclick="filterTasksTab('شخصي')" id="tt_شخصي" class="filter-chip">🏠 شخصي</button>
<button onclick="filterTasksTab('done')" id="tt_done" class="filter-chip">✓ منجز</button>
</div></div>
<div id="board" class="nu-scroll"></div>
</div>
<div id="secretCodeModal" onclick="if(event.target==this)closeSecretModal()"><div style="background:var(--card);color:var(--text);width:100%;max-width:345px;border-radius:18px;padding:16px;border:1px solid var(--card-border)"><div style="text-align:center"><div style="width:40px;height:40px;background:var(--bg-soft);border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto 7px;font-size:18px">✦</div><div style="font-weight:800;font-size:12.6px">الرقم التعريفي السري</div></div><input id="secretInput" type="tel" inputmode="numeric" placeholder="279" style="width:100%;background:var(--bg-soft);border:1px solid var(--card-border);padding:9px;border-radius:9px;color:var(--text);text-align:center;margin-top:11px;font-size:16px;font-weight:800"><div style="display:flex;gap:7px;margin-top:11px"><button onclick="closeSecretModal()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:9px;border-radius:9px;font-size:10.3px">إلغاء</button><button onclick="saveSecretCode()" style="flex:1;background:var(--hero);color:#fff;border:none;padding:9px;border-radius:9px;font-size:10.3px">حفظ</button></div><div id="currentCodeHint" style="font-size:9.2px;color:var(--text-soft);text-align:center;margin-top:9px"></div></div></div>
<div id="deleteWarningModal" onclick="if(event.target==this)closeDeleteWarning()"><div style="background:var(--card);width:100%;max-width:345px;border-radius:18px;overflow:hidden;border:1px solid var(--card-border)"><div style="background:#FEF2F2;padding:14px;text-align:center"><div style="font-size:28px">⚠️</div><div style="font-weight:900;color:#991B1B;font-size:12.6px">هتحذف؟</div></div><div style="padding:11px"><div id="delTaskPreview" style="background:var(--bg-soft);border:1px solid var(--card-border);border-radius:9px;padding:9px;margin-bottom:9px;font-size:11.5px"></div><label style="display:flex;gap:7px;align-items:center;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:9px;padding:8px"><input type="checkbox" id="delConfirmCheck" onchange="toggleDelBtn()"><span style="font-size:10.3px;font-weight:700">أنا متأكد</span></label><div style="display:flex;gap:9px;margin-top:9px"><button onclick="closeDeleteWarning()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:9px;border-radius:9px;font-size:10.3px">إلغاء</button><button id="finalDelBtn" onclick="confirmDelete()" disabled style="flex:1;background:#E5E7EB;color:#9CA3AF;border:none;padding:9px;border-radius:9px;font-weight:800;font-size:10.3px">حذف</button></div></div></div></div>
<div id="managerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;padding:11px"><div style="background:var(--card);width:100%;max-width:437px;border-radius:16px;overflow:hidden;max-height:85vh;display:flex;flex-direction:column;border:1px solid var(--card-border)"><div style="display:flex;gap:4px;background:var(--bg-soft);margin:9px;padding:4px;border-radius:9px"><button onclick="mTab('cats')" id="mTabCats" style="flex:1;padding:7px;border:none;border-radius:7px;background:var(--card);font-weight:700;color:var(--text);font-size:10.3px">📁 التصنيفات</button><button onclick="mTab('colors')" id="mTabColors" style="flex:1;padding:7px;border:none;border-radius:7px;background:transparent;color:var(--text-soft);font-size:10.3px">🎨 الألوان</button></div><div style="flex:1;overflow:auto;padding:0 11px 11px" class="nu-scroll"><div id="mCats"><div style="display:flex;gap:5px;margin-bottom:11px"><input id="newCatEmoji" placeholder="💊" style="width:41px;text-align:center;border:1px solid var(--card-border);border-radius:8px;padding:7px;background:var(--card);color:var(--text);font-size:11.5px"><input id="newCatName" placeholder="اسم التصنيف" style="flex:1;border:1px solid var(--card-border);border-radius:8px;padding:7px;background:var(--card);color:var(--text);font-size:11.5px"><button onclick="addCategory()" style="background:var(--hero);color:#fff;border:none;padding:7px 11px;border-radius:8px;font-size:11.5px">+</button></div><div id="catList"></div></div><div id="mColors" style="display:none"><div id="excelTheme" class="excel-grid"></div><div id="excelStandard" class="excel-grid" style="margin-top:9px"></div></div></div><div style="padding:9px 11px;border-top:1px solid var(--card-border)"><button onclick="closeManager()" style="width:100%;background:var(--bg-soft);border:1px solid var(--card-border);padding:8px;border-radius:9px;color:var(--text);font-size:10.3px">إغلاق</button></div></div></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:var(--card);z-index:9999;flex-direction:column;max-width:600px;margin:0 auto">
<div id="modalCover" style="height:69px;position:relative;flex-shrink:0;background:var(--bg-soft);border-bottom:1px solid var(--card-border)"><button onclick="closeModal()" style="position:absolute;top:9px;left:9px;background:rgba(0,0,0,.15);border:none;width:32px;height:32px;border-radius:50%;color:#000;font-weight:800;cursor:pointer;font-size:14px">✕</button></div>
<div style="padding:9px;flex:1;overflow:auto;display:flex;flex-direction:column;background:var(--bg)" class="nu-scroll">
<h2 id="modalTitle" contenteditable="true" style="font-size:13.8px;font-weight:800;outline:none;border-bottom:1px dashed var(--card-border);padding-bottom:7px;margin-bottom:9px;color:var(--text)"></h2>
<div style="background:var(--card);border:1px solid var(--card-border);border-radius:11px;padding:8px;margin-bottom:9px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><b style="font-size:10.3px">✔ مهام فرعية</b><span id="subProgress" style="font-size:9.2px;background:var(--bg-soft);padding:3px 7px;border-radius:99px">0/0</span></div><div id="subList" style="display:flex;flex-direction:column;gap:5px;margin-bottom:7px"></div><div style="display:flex;gap:5px"><input id="subInput" placeholder="مهمة فرعية + Enter" style="flex:1;border:1px solid var(--card-border);border-radius:7px;padding:7px;background:var(--card);color:var(--text);font-size:10.3px"><button onclick="addSub()" style="background:var(--hero);color:#fff;border:none;padding:7px 11px;border-radius:7px;font-weight:800;font-size:10.3px">+</button></div><div style="height:5px;background:var(--bg-soft);border-radius:10px;margin-top:7px;overflow:hidden"><div id="subBar" style="height:100%;width:0%;background:var(--hero)"></div></div></div>
<div style="display:flex;gap:4px;background:var(--bg-soft);padding:4px;border-radius:9px;margin-bottom:9px;overflow:auto" class="nu-scroll">
<button onclick="tab('colors')" id="tColors" class="tab">🎨 ألوان</button><button onclick="tab('camera')" id="tCamera" class="tab">📷 كاميرا</button><button onclick="tab('draw')" id="tDraw" class="tab">✏ رسم</button><button onclick="tab('voice')" id="tVoice" class="tab">🎙 فويس</button><button onclick="tab('note')" id="tNote" class="tab active">📝 نوت</button><button onclick="tab('rem')" id="tRem" class="tab">⏰ منبه</button><button onclick="tab('hidden')" id="tHidden" class="tab" style="display:none;background:var(--hero);color:#fff">🔒 الخاص</button>
</div>
<div id="pColors" style="display:none"><div style="display:flex;gap:7px;align-items:center;background:var(--bg-soft);padding:8px;border-radius:9px;margin-bottom:7px"><div style="font-size:10.3px;font-weight:700">اللون الحالي:</div><div id="currentColorPreview" style="width:23px;height:23px;border-radius:7px;border:1px solid var(--card-border);background:var(--card)"></div><button onclick="toggleAllColors()" style="margin-right:auto;background:var(--card);border:1px solid var(--card-border);padding:5px 9px;border-radius:7px;font-size:9.2px">عرض كل الألوان ▼</button></div><div id="allColorsBox" style="display:none;max-height:230px;overflow:auto;background:var(--bg-soft);padding:7px;border-radius:9px;border:1px solid var(--card-border)" class="nu-scroll"><div id="modalColorsTheme" class="excel-grid"></div><div id="modalColorsStandard" class="excel-grid" style="margin-top:7px"></div></div></div>
<div id="pCamera" style="display:none"><div style="display:flex;gap:5px;margin-bottom:7px"><button onclick="openCamera()" style="flex:1;background:var(--hero);color:#fff;border:none;padding:8px;border-radius:8px;font-weight:700;font-size:10.3px">📷 كاميرا</button><button onclick="document.getElementById('task-photo-file').click()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:8px;border-radius:8px;font-weight:700;font-size:10.3px">🖼 معرض</button><input type="file" id="task-photo-file" accept="image/*" style="display:none" onchange="handleFile(this)"></div><div id="cameraBox" style="display:none"><video id="cameraVideo" autoplay playsinline></video><canvas id="cameraCanvas" style="display:none"></canvas><div style="display:flex;gap:5px;margin-top:7px"><button onclick="closeCamera()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:7px;border-radius:7px;font-size:10.3px">إلغاء</button><button onclick="takePhoto()" style="flex:1;background:var(--hero);color:#fff;border:none;padding:7px;border-radius:7px;font-size:10.3px">التقاط</button></div></div><div id="photoGallery" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px"></div></div>
<div id="pDraw" style="display:none"><canvas id="canvas" style="width:100%;height:184px;border:1.5px dashed var(--card-border);border-radius:9px;background:var(--card)"></canvas><div style="display:flex;gap:5px;margin-top:7px;align-items:center"><input type="color" id="penColor" value="#111111" style="width:36px;height:32px;border:none"><input type="range" id="penSize" min="1" max="15" value="4" style="flex:1"><button onclick="clearCanvas()" style="background:#FEE2E2;border:none;padding:6px 9px;border-radius:7px;color:#ef4444;font-size:9.2px">مسح</button></div><button onclick="saveDraw()" style="width:100%;margin-top:7px;background:var(--hero);color:#fff;border:none;padding:8px;border-radius:8px;font-size:10.3px">💾 حفظ الرسم</button><div id="drawGallery" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px"></div></div>
<div id="pVoice" style="display:none"><div style="background:var(--bg-soft);border-radius:11px;padding:11px;text-align:center;border:1px solid var(--card-border)"><div id="timer" style="font-size:18px;font-weight:800">00:00</div><button id="recBtn" onclick="toggleRec()" style="width:58px;height:58px;border-radius:50%;background:#ef4444;border:none;color:#fff;font-size:20px;margin-top:7px">●</button><div style="font-size:9.2px;color:var(--text-soft);margin-top:5px">دوس للتسجيل</div></div><div id="voiceList" style="margin-top:7px;display:flex;flex-direction:column;gap:5px"></div></div>
<div id="pNote" style="display:flex;flex:1;flex-direction:column">
<div class="rich-toolbar">
<button onmousedown="event.preventDefault()" onclick="formatNote('bold')"><b>B</b></button>
<button onmousedown="event.preventDefault()" onclick="changeFontSize(2)">A+</button>
<button onmousedown="event.preventDefault()" onclick="changeFontSize(-2)">A-</button>
<button onmousedown="event.preventDefault()" onclick="formatNote('insertUnorderedList')">• نقط</button>
<button onmousedown="event.preventDefault()" onclick="formatNote('insertOrderedList')">1. ترقيم</button>
<div class="dot" style="background:#ef4444" onmousedown="event.preventDefault();applyNoteColor('#ef4444')"></div>
<div class="dot" style="background:#22c55e" onmousedown="event.preventDefault();applyNoteColor('#22c55e')"></div>
<div class="dot" style="background:#3b82f6" onmousedown="event.preventDefault();applyNoteColor('#3b82f6')"></div>
<div class="dot" style="background:#f59e0b" onmousedown="event.preventDefault();applyNoteColor('#f59e0b')"></div>
<div class="dot" style="background:#8b5cf6" onmousedown="event.preventDefault();applyNoteColor('#8b5cf6')"></div>
<div class="dot" style="background:var(--text)" onmousedown="event.preventDefault();applyNoteColor('#111111')"></div>
</div>
<div id="noteEditor" class="rich-editor" contenteditable="true"></div>
<button onclick="saveNote()" style="width:100%;margin-top:7px;background:var(--hero);color:#fff;border:none;padding:8px;border-radius:9px;font-weight:800;font-size:10.3px">حفظ النوت</button>
</div>
<div id="pRem" style="display:none"><div style="background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:11px"><label style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;margin-bottom:11px"><span>🔔 تفعيل المنبه الاحترافي</span><input type="checkbox" id="remEnabled" onchange="toggleRem()" style="width:20px;height:20px"></label><div id="remBox" style="display:none"><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px"><div><div style="font-size:9.2px;color:var(--text-soft);margin-bottom:2px">التاريخ</div><input type="date" id="remDate" style="width:100%;border:1px solid var(--card-border);border-radius:8px;padding:8px;background:var(--bg-soft);font-size:11.5px"></div><div><div style="font-size:9.2px;color:var(--text-soft);margin-bottom:2px">الوقت</div><input type="time" id="remTime" style="width:100%;border:1px solid var(--card-border);border-radius:8px;padding:8px;background:var(--bg-soft);font-size:11.5px"></div></div><div style="margin-bottom:9px"><div style="font-size:9.2px;color:var(--text-soft);margin-bottom:2px">التكرار</div><select id="remRepeat" onchange="updateRepeatUI()" style="width:100%;border:1px solid var(--card-border);border-radius:8px;padding:8px;background:var(--bg-soft);font-size:11.5px"><option value="none">🔕 مرة واحدة</option><option value="daily">🔁 يومياً</option><option value="weekly">📅 أسبوعياً</option><option value="monthly">🗓️ شهرياً</option><option value="yearly">🎂 سنوياً</option><option value="custom_days">⏱️ كل X أيام</option><option value="custom_hours">⏰ كل X ساعات</option><option value="weekdays">📌 أيام محددة</option></select></div><div id="customRepeatBox" style="display:none;background:var(--bg-soft);border:1px dashed var(--card-border);border-radius:9px;padding:9px;margin-bottom:9px"><div id="customDaysUI" style="display:none"><label style="font-size:10.3px">كل كام يوم؟</label><input type="number" id="remEveryDays" value="2" min="1" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--card-border);margin-top:5px"></div><div id="customHoursUI" style="display:none"><label style="font-size:10.3px">كل كام ساعة؟</label><input type="number" id="remEveryHours" value="3" min="1" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--card-border);margin-top:5px"></div><div id="weekdaysUI" style="display:none"><label style="font-size:10.3px">اختار الأيام:</label><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px"><label style="font-size:10.3px"><input type="checkbox" value="6" class="wd"> سبت</label><label style="font-size:10.3px"><input type="checkbox" value="0" class="wd"> أحد</label><label style="font-size:10.3px"><input type="checkbox" value="1" class="wd"> اثنين</label><label style="font-size:10.3px"><input type="checkbox" value="2" class="wd"> ثلاثاء</label><label style="font-size:10.3px"><input type="checkbox" value="3" class="wd"> أربعاء</label><label style="font-size:10.3px"><input type="checkbox" value="4" class="wd"> خميس</label><label style="font-size:10.3px"><input type="checkbox" value="5" class="wd"> جمعة</label></div></div></div><div style="margin-bottom:9px"><div style="font-size:9.2px;color:var(--text-soft);margin-bottom:2px">ينتهي؟</div><select id="remEndType" onchange="updateEndUI()" style="width:100%;border:1px solid var(--card-border);border-radius:8px;padding:8px;background:var(--bg-soft);font-size:11.5px"><option value="never">♾️ للأبد</option><option value="after">🔢 بعد عدد مرات</option><option value="onDate">📅 حتى تاريخ</option></select><input type="number" id="remAfterCount" placeholder="مثال: 10" style="display:none;width:100%;margin-top:7px;padding:7px;border-radius:7px;border:1px solid var(--card-border)"><input type="date" id="remEndDate" style="display:none;width:100%;margin-top:7px;padding:7px;border-radius:7px;border:1px solid var(--card-border)"></div><div id="remNext" style="font-size:10.3px;color:var(--primary);font-weight:800;background:var(--bg-soft);padding:7px;border-radius:7px;text-align:center;margin-bottom:9px">حدد الوقت</div><button onclick="saveReminderPro()" style="width:100%;background:var(--primary);color:#fff;border:none;padding:10px;border-radius:9px;font-weight:900;font-size:11.5px">💾 حفظ المنبه + تفعيل الإشعار برا</button></div></div></div>
<div id="pHidden" style="display:none"><div id="hiddenAuth" style="background:var(--card);border-radius:11px;padding:11px;border:1px solid var(--card-border)"><div style="text-align:center"><div style="font-size:28px">🔒</div><div style="font-weight:800;font-size:11.5px;margin-top:5px">القسم الخاص</div></div><input id="hPass" type="password" inputmode="numeric" placeholder="••••" style="width:100%;background:var(--bg-soft);border:1px solid var(--card-border);padding:9px;border-radius:8px;text-align:center;margin-top:9px"><button onclick="unlockHidden()" style="width:100%;margin-top:7px;background:var(--hero);color:#fff;border:none;padding:8px;border-radius:8px;font-size:10.3px">فتح 🔓</button><div id="hErr" style="color:#ff5a5a;font-size:9.2px;text-align:center;margin-top:7px;display:none"></div></div><div id="hiddenContent" style="display:none"><div style="background:var(--card);border-radius:11px;padding:9px;border:1px solid var(--card-border)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><b style="font-size:10.3px">📓 الخاص</b><div style="display:flex;gap:5px"><button onclick="openChangePassword()" style="background:var(--bg-soft);border:1px solid var(--card-border);padding:5px 7px;border-radius:7px;font-size:9.2px">🔑</button><button onclick="openHiddenEditor()" style="background:var(--hero);color:#fff;border:none;padding:5px 9px;border-radius:7px;font-size:9.2px">+ نوت</button><button onclick="hideHiddenTab()" style="background:var(--bg-soft);border:1px solid var(--card-border);padding:5px 7px;border-radius:7px;font-size:9.2px">إخفاء</button></div></div><div id="hiddenEditorBox" style="display:none;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:9px;padding:7px;margin-bottom:7px"><div class="rich-toolbar"><button onmousedown="event.preventDefault()" onclick="formatHidden('bold')"><b>B</b></button><button onmousedown="event.preventDefault()" onclick="changeHiddenFontSize(2)">A+</button><button onmousedown="event.preventDefault()" onclick="changeHiddenFontSize(-2)">A-</button><button onmousedown="event.preventDefault()" onclick="formatHidden('insertUnorderedList')">• نقط</button><button onmousedown="event.preventDefault()" onclick="formatHidden('insertOrderedList')">1. ترقيم</button><div class="dot" style="background:#ef4444" onmousedown="event.preventDefault();applyHiddenColor('#ef4444')"></div><div class="dot" style="background:#22c55e" onmousedown="event.preventDefault();applyHiddenColor('#22c55e')"></div><div class="dot" style="background:#3b82f6" onmousedown="event.preventDefault();applyHiddenColor('#3b82f6')"></div><div class="dot" style="background:#f59e0b" onmousedown="event.preventDefault();applyHiddenColor('#f59e0b')"></div><div class="dot" style="background:#fff" onmousedown="event.preventDefault();applyHiddenColor('#ffffff')"></div></div><input id="hiddenTitle" placeholder="عنوان..." style="width:100%;background:var(--card);border:1px solid var(--card-border);padding:7px;border-radius:7px;color:var(--text);margin-bottom:7px;font-size:10.3px"><div id="hiddenBody" class="rich-editor" contenteditable="true" style="background:var(--card);color:var(--text);min-height:17vh;font-size:11.5px"></div><div style="display:flex;gap:5px;margin-top:7px"><button onclick="saveHiddenRich()" style="flex:1;background:var(--hero);color:#fff;border:none;padding:7px;border-radius:7px;font-weight:800;font-size:10.3px">حفظ</button><button onclick="closeHiddenEditor()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:7px;border-radius:7px;font-size:10.3px">إلغاء</button></div></div><input id="hSearch" placeholder="بحث..." oninput="renderHidden()" style="width:100%;background:var(--bg-soft);border:1px solid var(--card-border);padding:7px 9px;border-radius:7px;font-size:10.3px;margin-bottom:7px"><div id="hList"></div></div></div></div>
</div>
<div style="padding:7px 9px;border-top:1px solid var(--card-border);display:flex;gap:7px;flex-shrink:0;background:var(--card)"><button onclick="deleteCurrent()" style="background:#FFF1F2;color:#ef4444;border:1px solid #FECDD3;padding:8px 11px;border-radius:8px;flex:1;font-weight:800;font-size:9.2px">🗑 حذف</button><button onclick="toggleDone()" id="doneBtn" style="background:var(--hero);color:#fff;border:none;padding:8px 11px;border-radius:8px;font-weight:800;flex:2;font-size:10.3px">تم ✓</button></div>
</div>
<script src="tasks-logic.js"></script>
